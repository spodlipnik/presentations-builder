# Talk Builder — Personal Configuration
# Copy this file to your assets directory as config.yaml
# Run /talk-setup to generate this interactively

language: "en"
narrative_style: "conversational"
complexity_default: "moderate"

# Design tokens — applied to every chart/diagram (talk-assets) and every
# slide (talk-slides delegates to document-skills:pptx with these values).
# Keep colors and fonts coherent — this is the single source of truth for
# visual style.
design_tokens:
  color:
    primary: "#0B3D91"      # dominant brand color
    accent: "#E63946"       # highlights, section labels (use sparingly)
    text: "#1A1A1A"         # default body text
    background: "#FFFFFF"   # default slide background
    muted: "#6C757D"        # captions, attributions, secondary text
  typography:
    heading_font: "Avenir Heavy"   # slide titles, headlines, big numbers
    body_font: "Avenir Book"       # body text, captions
