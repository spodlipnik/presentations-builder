name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango-1.0-0 libgdk-pixbuf2.0-0 poppler-utils

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r assets/scripts/requirements.txt
          pip install -r assets/scripts/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  validate:
    name: structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator deps
        run: pip install PyYAML

      - name: Validate plugin structure
        run: python tools/validate_plugin.py
